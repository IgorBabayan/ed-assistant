name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:        # lets you also run it manually from the Actions tab

permissions:
  contents: write           # needed to create/update the "latest" release

env:
  PROJECT: ED.Assistant/ED.Assistant.csproj
  APP_EXE: ED.Assistant
  ICON_PNG: ED.Assistant/Assets/logo.png   # 256x256 PNG - add this to the repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows (win-x64)
        run: >
          dotnet publish $PROJECT -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Publish Linux (linux-x64)
        run: >
          dotnet publish $PROJECT -c Release -r linux-x64 --self-contained true
          -o publish/linux-x64

      - name: Package Windows zip
        run: |
          cd publish/win-x64
          zip -r ../../ED.Assistant-win-x64.zip .

      - name: Build AppImage
        run: |
          APPDIR=ED.Assistant.AppDir
          mkdir -p $APPDIR/usr/bin
          cp -r publish/linux-x64/. $APPDIR/usr/bin/
          cp "$ICON_PNG" $APPDIR/ed-assistant.png

          cat > $APPDIR/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/ED.Assistant" "$@"
          EOF
          sed -i 's/^ *//' $APPDIR/AppRun

          cat > $APPDIR/ed-assistant.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=ED Assistant
          Exec=ED.Assistant
          Icon=ed-assistant
          Categories=Utility;Game;
          Terminal=false
          EOF
          sed -i 's/^ *//' $APPDIR/ed-assistant.desktop

          chmod +x $APPDIR/AppRun $APPDIR/usr/bin/$APP_EXE

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            $APPDIR ED.Assistant-x86_64.AppImage

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ED.Assistant-build-${{ github.run_number }}
          path: |
            ED.Assistant-win-x64.zip
            ED.Assistant-x86_64.AppImage

      - name: Update "latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            ED.Assistant-win-x64.zip \
            ED.Assistant-x86_64.AppImage \
            --target ${{ github.sha }} \
            --prerelease \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Automatic build from commit ${{ github.sha }}"
            